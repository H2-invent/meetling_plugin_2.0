<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meetling Konferenz</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/meetling-theme.css" rel="stylesheet">
</head>
<body class="popup-page">
  <header id="pageHeader" class="app-header">
    <img class="brand-logo" src="images/app_meetling_de_logo.png" alt="Meetling">
    <span id="dev" class="environment-badge" hidden>DEV</span>
    <nav class="header-actions" aria-label="Schnellzugriff">
      <button id="dashboardBtn" class="icon-button" type="button" title="Dashboard öffnen" aria-label="Dashboard öffnen">
        <span aria-hidden="true">⌂</span>
      </button>
      <button id="configBtn" class="icon-button" type="button" title="Einstellungen öffnen" aria-label="Einstellungen öffnen">
        <span aria-hidden="true">⚙</span>
      </button>
      <button id="disableNotificationBtn" class="icon-button notification-button" type="button" title="Benachrichtigungen aktivieren" aria-label="Benachrichtigungen aktivieren">
        <span aria-hidden="true">◌</span>
      </button>
      <button id="enableNotificationBtn" class="icon-button notification-button" type="button" title="Benachrichtigungen deaktivieren" aria-label="Benachrichtigungen deaktivieren">
        <span aria-hidden="true">●</span>
      </button>
    </nav>
  </header>

  <main class="app-content">
    <section class="intro" aria-labelledby="popup-title">
      <span class="eyebrow">Sicher. Einfach. Verbunden.</span>
      <h1 id="popup-title">Wen möchtest du treffen?</h1>
      <p>Starte deine Videokonferenz direkt aus dem Browser.</p>
    </section>

    <button id="loginBtn" class="meetling-button meetling-button--primary w-100 mb-3" type="button">
      Bei Meetling anmelden
    </button>

    <div id="logged_in">
      <section id="contactSection" class="hidden" aria-label="Kontakte">
        <label class="visually-hidden" for="contactSearch">Kontakt suchen</label>
        <div class="search-field">
          <span aria-hidden="true">⌕</span>
          <input id="contactSearch" type="search" placeholder="Kontakt suchen …" autocomplete="off">
        </div>
        <ul id="contactList" class="contact-list" aria-label="Kontaktliste"></ul>
      </section>

      <button id="startBtn" class="meetling-button meetling-button--primary w-100 disabled" type="button" disabled>
        Kontakt auswählen
      </button>
    </div>

    <div class="divider"><span>oder</span></div>

    <button id="instantBtn" class="meetling-button meetling-button--secondary w-100" type="button">
      Sofortkonferenz starten
    </button>
  </main>

  <footer class="app-footer">
    <span class="secure-dot" aria-hidden="true"></span>
    Bereit für deine nächste Begegnung · Version <span id="appVersion"></span>
  </footer>

  <div id="loadingOverlay" class="loading-overlay d-none" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="spinner-border" aria-hidden="true"></div>
      <strong>Konferenz wird vorbereitet</strong>
      <span>Einen kleinen Moment bitte …</span>
    </div>
  </div>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
