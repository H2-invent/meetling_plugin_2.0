<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Meetling Konferenz</title>

  <!-- Bootstrap 5 -->
  <link href="css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #ffffff;
      color: #000000;
      width: 350px;
      font-family: 'Roboto', sans-serif;
      position: relative;
    }

    .form-select {
      color: #000000;
      background: transparent;
    }

    .form-floating .form-select {
      padding-top: unset;
      padding-bottom: unset;
    }

    .form-floating .form-select option {
      padding-top: unset;
      padding-bottom: unset;
      color: #000000;
    }

    .icon-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 15px;
    }

    .icon-buttons button {
      background: transparent;
      border: none;
      font-size: 20px;
      cursor: pointer;
      padding: 8px;
      border-radius: 6px;
      transition: background-color 0.2s ease;
    }

    .icon-buttons button:hover {
      background-color: rgba(0, 0, 0, 0.1);
    }

    #pageHeader {
      background-color: #dddddd;
      padding: 12px;
      height: 50px;
    }

    .hidden {
      display: none;
    }

    #loginBtn, #logged_in {
      display: none;
    }

    .headerBtn {
      position: absolute;
      top: 10px;
      background: transparent;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: #f8f9fa;
      z-index: 10;
    }

    .notificationBtn {
      right: 10px;
    }

    #configBtn {
      right: 40px;
    }

    #dashboardBtn {
      right: 70px;
    }

    #dev {
      position: absolute;
      top: 5px;
      left: 100px;
      background-color: red;
      padding: 2px;
      padding-left: 10px;
      padding-right: 10px;
      font-size: 10px;
      border-radius: 5px;
    }

    button:hover {
      opacity: 0.85;
    }

    .contact-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 200px;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .contact-item {
      display: flex;
      align-items: center;
      padding: 8px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
    }

    .contact-item:hover {
      background-color: #f8f8f8;
    }

    .contact-item.selected {
      background-color: #d0f0c0;
      color: #2c662d;
      border-radius: 4px;
    }

    .contact-name {
      flex-grow: 1;
      display: inline-block;  /* damit max-width wirkt */
      white-space: nowrap;    /* keine Zeilenumbrüche */
      overflow: hidden;       /* Text, der nicht passt, ausblenden */
      text-overflow: ellipsis;/* '...' anzeigen */
      vertical-align: middle; /* optional für bessere Ausrichtung */
    }

    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-left: 8px;
      display: inline-block;
    }

    .meetling-primary {
      background-color: #29b5a1
    }
    .meetling-primary:hover {
      background-color: #6ae6d3
    }

    .meetling-secondary {
      background-color: #a050af
    }
    .meetling-secondary:hover {
      background-color: #c56dd4
    }

    .status-meeting {
      background-color: #0158b0;
    }
    .status-away {
      background-color: #f9a825;
    }
    .status-online {
      background-color: #00b047;
    }
    .status-offline {
      background-color: gray;
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6); /* halbtransparent */
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .loading-spinner {
      text-align: center;
      color: white;
    }
  </style>
</head>

<body>

  <!-- Dunklerer Header -->
  <div id="pageHeader">
    <img style="height: 30px;" src="./images/app_meetling_de_logo.png">
    <p id="dev" style="display: none;"></p>
    <button id="dashboardBtn" class="headerBtn" title="Dashboard">🏠</button>
    <button id="configBtn" class="headerBtn" title="Settings">⚙️</button>
    <button id="disableNotificationBtn" title="Toggle Notification" class="headerBtn notificationBtn">🔕</button>
    <button id="enableNotificationBtn" title="Toggle Notification" class="headerBtn notificationBtn">🔔</button>
  </div>

  <div class="m-4">
    <button id="loginBtn" class="btn rounded-pill meetling-primary w-100 mb-3">
      <i class="bi bi-person"></i> Login
    </button>

    <div id="logged_in">
      <div id="contactSection" class="hidden">
        <div class="form-floating mb-3">
          <div class="input-group mb-3">
            <input id="contactSearch" type="text" class="form-control pt-2 pb-2" placeholder="Kontakt suchen..." aria-label="Username" aria-describedby="basic-addon1">
          </div>
          <ul id="contactList" class="contact-list"></ul>
        </div>
      </div>

      <button id="startBtn" class="btn rounded-pill meetling-primary w-100 disabled">
        Kontakt auswählen
      </button>
    </div>

    <button id="instantBtn" class="btn rounded-pill meetling-secondary w-100 mt-2">
      Sofortkonferenz starten
    </button>
  </div>
  <div id="loadingOverlay" class="loading-overlay d-none">
    <div class="loading-spinner text-center">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Lädt...</span>
      </div>
      <div class="mt-2 text-white">Wir bereiten alles vor...</div>
    </div>
  </div>
  <!-- Bootstrap Icons & Scripts -->
  <script src="./js/bootstrap.bundle.min.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
