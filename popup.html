<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meetling Konferenz</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/meetling-theme.css" rel="stylesheet">
</head>
<body class="popup-page">
  <header id="pageHeader" class="app-header">
    <img class="brand-logo" src="images/app_meetling_de_logo.png" alt="Meetling">
    <span id="dev" class="environment-badge" hidden>DEV</span>
    <nav class="header-actions" aria-label="Schnellzugriff">
      <button id="dashboardBtn" class="icon-button" type="button" title="Dashboard öffnen" aria-label="Dashboard öffnen">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 10v9h13v-9M9.5 19v-5h5v5"/></svg>
      </button>
      <button id="configBtn" class="icon-button" type="button" title="Einstellungen öffnen" aria-label="Einstellungen öffnen">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 15.25A3.25 3.25 0 1 0 12 8.75a3.25 3.25 0 0 0 0 6.5ZM19.2 13.2l1.35 1.05-1.75 3.03-1.59-.64a7.9 7.9 0 0 1-2.11 1.22L14.85 19.5h-3.5l-.25-1.64a7.9 7.9 0 0 1-2.11-1.22l-1.59.64-1.75-3.03L7 13.2a8.18 8.18 0 0 1 0-2.4L5.65 9.75 7.4 6.72l1.59.64A7.9 7.9 0 0 1 11.1 6.14l.25-1.64h3.5l.25 1.64a7.9 7.9 0 0 1 2.11 1.22l1.59-.64 1.75 3.03-1.35 1.05a8.18 8.18 0 0 1 0 2.4Z"/></svg>
      </button>
      <button id="disableNotificationBtn" class="icon-button notification-button" type="button" title="Benachrichtigungen aktivieren" aria-label="Benachrichtigungen aktivieren">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-9.75-4.68M6.35 6.35A5.96 5.96 0 0 0 6 8.4V13l-2 3h12.5M10 20h4M3 3l18 18"/></svg>
      </button>
      <button id="enableNotificationBtn" class="icon-button notification-button" type="button" title="Benachrichtigungen deaktivieren" aria-label="Benachrichtigungen deaktivieren">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 13V9a6 6 0 0 0-12 0v4l-2 3h16l-2-3ZM10 20h4"/></svg>
      </button>
    </nav>
  </header>

  <main class="app-content">
    <section id="introSection" class="intro" aria-labelledby="popup-title">
      <div class="intro-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M15 10.5 20 8v8l-5-2.5M4 6.5h11v11H4z"/></svg>
      </div>
      <div>
        <span class="eyebrow">Digitale Besprechung</span>
        <h1 id="popup-title">Sicher verbunden.</h1>
        <p>Starten Sie eine geschützte Videokonferenz direkt aus dem Browser.</p>
      </div>
    </section>

    <button id="loginBtn" class="meetling-button meetling-button--primary w-100 mb-3" type="button">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M14 4h6v16h-6"/></svg>
      Bei Meetling anmelden
    </button>

    <div id="logged_in">
      <section id="contactSection" class="hidden" aria-label="Kontakte">
        <label class="visually-hidden" for="contactSearch">Kontakt suchen</label>
        <div class="search-field">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
          <input id="contactSearch" type="search" placeholder="Kontakt suchen …" autocomplete="off">
        </div>
        <ul id="contactList" class="contact-list" aria-label="Kontaktliste"></ul>
      </section>

      <button id="startBtn" class="meetling-button meetling-button--primary w-100 disabled" type="button" disabled>
        Kontakt auswählen
      </button>
    </div>

    <div class="divider"><span>oder</span></div>

    <button id="instantBtn" class="meetling-button meetling-button--secondary w-100" type="button">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15 10.5 20 8v8l-5-2.5M4 6.5h11v11H4z"/></svg>
      Sofortkonferenz starten
    </button>
  </main>

  <footer class="app-footer">
    <span class="security-status"><span class="secure-dot" aria-hidden="true"></span>Sichere Verbindung</span>
    <span class="version-label">Version <span id="appVersion"></span></span>
  </footer>

  <div id="loadingOverlay" class="loading-overlay d-none" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="spinner-border" aria-hidden="true"></div>
      <strong>Konferenz wird vorbereitet</strong>
      <span>Einen kleinen Moment bitte …</span>
    </div>
  </div>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
