<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Eingehender Meetling-Anruf</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: sans-serif;
      padding: 10px;
      text-align: center;
    }
  </style>
</head>
<body style="position: relative; overflow: hidden;">
  <img src="app_meetling_de_chrome_plugin.png" 
      alt="Meetling Logo" 
      style="
        position: absolute;
        top: 50%;
        right: -63px; 
        transform: translateY(-50%);
        opacity: 0.15; 
        width: 126px; 
        pointer-events: none; 
        user-select: none;
        z-index: 0;
      " />
  <main style="position: relative; z-index: 1; padding: 10px;" aria-live="assertive">
    <h2 class="title" id="popup-title">Eingehender Anruf</h2>
    <p class="message mb-3" id="popup-message">Jemand möchte eine Ad-hoc-Konferenz starten.</p>
    <div class="d-flex justify-content-center gap-2">
      <button id="joinButton" type="button" class="btn rounded-pill btn-lg btn-success">Beitreten</button>
      <button id="declineButton" type="button" class="btn rounded-pill btn-lg btn-danger">Ablehnen</button>
    </div>
  </main>
  <script src="./js/bootstrap.bundle.min.js"></script>
  <script type="module" src="call_popup.js"></script>
</body>
</html>
