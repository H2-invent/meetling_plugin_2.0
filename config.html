<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meetling Einstellungen</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/meetling-theme.css" rel="stylesheet">
</head>
<body class="settings-page">
  <header class="app-header">
    <img class="brand-logo" src="images/app_meetling_de_logo.png" alt="Meetling">
  </header>

  <main class="settings-content">
    <span class="eyebrow">Browser-Erweiterung</span>
    <h1>Einstellungen</h1>
    <p class="settings-lead">Verbinde die Erweiterung mit deiner Meetling-Instanz.</p>

    <form id="configForm" class="settings-form">
      <label for="meetlingAddonBaseUrl">Meetling Base URL</label>
      <input type="url" id="meetlingAddonBaseUrl" required placeholder="https://app.meetling.de" autocomplete="url">

      <label for="meetlingAddonServerId">Meetling Server-ID</label>
      <input type="text" id="meetlingAddonServerId" required placeholder="2" inputmode="numeric">

      <div class="settings-actions">
        <button class="meetling-button meetling-button--primary" type="submit">
          Speichern
        </button>
        <button class="meetling-button meetling-button--ghost" id="resetButton" type="button">Zurücksetzen</button>
      </div>
    </form>

    <aside class="policy-info">
      <span class="info-symbol" aria-hidden="true">i</span>
      <p>Diese Erweiterung kann auch über verwaltete Unternehmensrichtlinien konfiguriert werden.
        <a href="https://meetling.de/tutorials/chrome-addon-einrichten/" target="_blank" rel="noopener noreferrer">Zur Anleitung</a>
      </p>
    </aside>
  </main>
  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="config.js"></script>
</body>
</html>
