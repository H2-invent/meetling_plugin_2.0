name: Build and release extension

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read and validate extension version
        id: version
        shell: bash
        run: |
          version="$(jq -er '.version' manifest.json)"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "Invalid Chrome extension version: $version" >&2
            exit 1
          fi
          echo "number=$version" >> "$GITHUB_OUTPUT"
          echo "archive=meetling-plugin-$version.zip" >> "$GITHUB_OUTPUT"

      - name: Create installable ZIP
        shell: bash
        run: |
          mkdir -p dist
          git ls-files -z \
            ':!.github/**' \
            ':!dist/**' \
            ':!.gitignore' \
            | xargs -0 zip -9 "dist/${{ steps.version.outputs.archive }}"
          unzip -t "dist/${{ steps.version.outputs.archive }}"
          unzip -Z1 "dist/${{ steps.version.outputs.archive }}" | grep -qx 'manifest.json'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: meetling-plugin-${{ steps.version.outputs.number }}
          path: dist/${{ steps.version.outputs.archive }}
          if-no-files-found: error

      - name: Create GitHub release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.number }}-build.${{ github.run_number }}
          name: Meetling Plugin v${{ steps.version.outputs.number }} (Build ${{ github.run_number }})
          body: |
            Automatisch erstelltes Release für Version `${{ steps.version.outputs.number }}`.

            Die ZIP-Datei enthält das Plugin direkt auf der obersten Ebene und kann nach dem Entpacken unmittelbar über „Entpackte Erweiterung laden“ installiert werden.
          files: dist/${{ steps.version.outputs.archive }}
          fail_on_unmatched_files: true
