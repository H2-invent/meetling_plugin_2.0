name: Build and release extension

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate extension version
        id: version
        shell: bash
        run: |
          base_version="$(jq -er '.version' manifest.json)"
          IFS=. read -r major minor _ <<< "$base_version"
          version="${major}.${minor}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){3}$ ]]; then
            echo "Invalid generated Chrome extension version: $version" >&2
            exit 1
          fi

          for component in ${version//./ }; do
            if (( component > 65535 )); then
              echo "Version component exceeds Chrome's limit: $component" >&2
              exit 1
            fi
          done

          jq --arg version "$version" '.version = $version' manifest.json > manifest.tmp.json
          mv manifest.tmp.json manifest.json
          echo "number=$version" >> "$GITHUB_OUTPUT"
          echo "archive=meetling-plugin-$version.zip" >> "$GITHUB_OUTPUT"

      - name: Prepare extension package
        shell: bash
        run: |
          mkdir -p dist/package
          git ls-files -z \
            ':!.github/**' \
            ':!dist/**' \
            ':!.gitignore' \
            | while IFS= read -r -d '' file; do
                mkdir -p "dist/package/$(dirname "$file")"
                cp "$file" "dist/package/$file"
              done
          cp manifest.json dist/package/manifest.json

      - name: Create release ZIP
        shell: bash
        working-directory: dist/package
        run: |
          zip -9 -r "../${{ steps.version.outputs.archive }}" .
          unzip -t "../${{ steps.version.outputs.archive }}"
          unzip -Z1 "../${{ steps.version.outputs.archive }}" | grep -qx 'manifest.json'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: meetling-plugin-${{ steps.version.outputs.number }}
          path: dist/package/
          if-no-files-found: error

      - name: Create GitHub release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.number }}-build.${{ github.run_number }}
          name: Meetling Plugin v${{ steps.version.outputs.number }} (Build ${{ github.run_number }})
          body: |
            Automatisch erstelltes Release für die individuelle Build-Version `${{ steps.version.outputs.number }}`.

            Die ZIP-Datei enthält das Plugin direkt auf der obersten Ebene und kann nach dem Entpacken unmittelbar über „Entpackte Erweiterung laden“ installiert werden.
          files: dist/${{ steps.version.outputs.archive }}
          fail_on_unmatched_files: true
